name: Update prices

on:
  schedule:
    # NSE closes 15:30 IST. 11:30 UTC = 17:00 IST, Mon-Fri, once EOD data is settled.
    # Also Saturday, so Friday's close shows over the weekend.
    - cron: "30 11 * * 1-6"
  # Runs straight away whenever you upload an NSE file into the nse-data folder.
  push:
    paths:
      - "nse-data/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python scripts/update_perf.py
      - name: Commit if changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add perf.js
          git diff --cached --quiet && exit 0
          git commit -m "Update EOD prices"
          # If you uploaded files while this ran, fetch them first, then push.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
